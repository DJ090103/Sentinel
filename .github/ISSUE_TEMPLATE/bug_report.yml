name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you expected instead, too.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    attributes:
      label: OS and version
      placeholder: "e.g. macOS 15.1, Windows 11 24H2, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    attributes:
      label: Sentinel version
    validations:
      required: true
